<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icono.svg">
<link rel="icon" type="image/svg+xml" href="icono.svg">
<meta name="theme-color" content="#7D3C0A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Arbol">
<title>Arbol Genealogico - Clara Juana y Roberto</title>
<style>
  :root{ --azul:#0B3D91; --azul2:#1450B4; --crema:#FBF7EE; --papel:#FFFDF7; --borde:#D8CDB4; --gris:#5A5348; --verde:#1E8449; --rojo:#B03A2E; --marron:#7D3C0A; --marron2:#B45A12; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:Georgia,'Times New Roman',serif; background:var(--crema); color:#222; }
  header{ background:linear-gradient(135deg,var(--marron),var(--marron2)); color:#fff; padding:20px 16px 14px; text-align:center; }
  header h1{ margin:0 0 4px; font-size:25px; }
  header p{ margin:0; opacity:.9; font-size:13.5px; font-style:italic; }
  .tituloFotos{ display:flex; align-items:center; justify-content:center; gap:16px; }
  .tituloFotos img{ width:78px; height:78px; border-radius:50%; object-fit:cover; border:3px solid #fff; box-shadow:0 3px 10px rgba(0,0,0,.3); flex:none; }
  @media (max-width:560px){ .tituloFotos img{ width:58px; height:58px; } .tituloFotos{ gap:10px; } }
  .buscador{ max-width:640px; margin:12px auto 4px; position:relative; }
  .buscador input{ width:100%; padding:12px 14px; font-size:16px; border-radius:10px; border:none; font-family:inherit; }
  .resultados{ position:absolute; left:0; right:0; top:50px; background:#fff; color:#222; border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.25); overflow:hidden; z-index:60; text-align:left; }
  .resultados div{ padding:10px 14px; cursor:pointer; border-bottom:1px solid #eee; font-size:15px; }
  .resultados div:hover{ background:#FFF3E6; }
  .resultados small{ color:var(--gris); }
  main{ max-width:880px; margin:0 auto; padding:16px 14px 40px; }
  .tarjeta{ background:var(--papel); border:1px solid var(--borde); border-radius:14px; padding:18px; box-shadow:0 2px 8px rgba(0,0,0,.05); margin-bottom:12px; }
  .perfil{ display:flex; gap:18px; align-items:flex-start; border:2px solid var(--marron2); background:linear-gradient(180deg,#FFF4E5,var(--papel)); }
  .perfil .fotoP{ width:130px; height:130px; border-radius:12px; object-fit:cover; border:3px solid var(--marron2); flex:none; }
  .perfil .sinFoto{ width:130px; height:130px; border-radius:12px; background:#EFE7D3; display:flex; align-items:center; justify-content:center; font-size:52px; flex:none; border:3px solid var(--borde); }
  .perfil h2{ margin:0 0 8px; color:var(--marron); font-size:25px; }
  .dato{ font-size:15px; margin:4px 0; } .dato b{ color:var(--gris); font-weight:normal; display:inline-block; min-width:92px; }
  .resumen{ font-size:14.5px; color:#333; margin-top:8px; line-height:1.45; }
  .resumen a{ color:var(--azul2); cursor:pointer; text-decoration:none; } .resumen a:hover{ text-decoration:underline; }
  @media (max-width:560px){ .perfil{ flex-direction:column; align-items:center; text-align:left; } .perfil h2{ text-align:center; } }
  .tabs{ display:flex; gap:5px; flex-wrap:wrap; margin-top:16px; }
  .tab{ padding:9px 18px; border:1px solid var(--borde); border-bottom:none; border-radius:11px 11px 0 0; background:#EFE7D3; cursor:pointer; font-size:15.5px; font-family:inherit; }
  .tab.activa{ background:var(--papel); font-weight:bold; color:var(--marron); }
  .panel{ border:1px solid var(--borde); border-radius:0 12px 12px 12px; background:var(--papel); padding:16px 18px; }
  h3.seccion{ color:var(--marron); border-bottom:2px solid var(--borde); padding-bottom:4px; margin:20px 0 10px; font-size:18px; }
  h3.seccion:first-child{ margin-top:2px; }
  .fila{ display:flex; flex-wrap:wrap; gap:10px; }
  .persona{ flex:1 1 200px; background:#fff; border:1px solid var(--borde); border-radius:10px; padding:10px 12px; cursor:pointer; transition:.15s; }
  .persona:hover{ border-color:var(--marron2); box-shadow:0 3px 10px rgba(180,90,18,.18); transform:translateY(-1px); }
  .persona .nom{ font-weight:bold; font-size:16px; }
  .persona .det{ color:var(--gris); font-size:13px; margin-top:2px; }
  .persona.actual{ border-color:var(--verde); background:#EFFAF3; cursor:default; }
  .foto-mini{ width:44px; height:44px; border-radius:50%; object-fit:cover; float:left; margin-right:10px; border:2px solid var(--borde); }
  .foto-xs{ width:26px; height:26px; border-radius:50%; object-fit:cover; vertical-align:middle; margin-right:6px; }
  .rol{ display:inline-block; font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:#fff; background:var(--azul2); border-radius:20px; padding:2px 9px; margin-bottom:6px; }
  .rol.madre{ background:#8E44AD; } .rol.padre{ background:var(--azul); } .rol.pareja{ background:var(--rojo); }
  .rol.hijo{ background:var(--verde); } .rol.hermano{ background:#7D6608; }
  .botones{ text-align:center; margin:14px 0 4px; }
  button{ font-family:inherit; font-size:14.5px; padding:9px 16px; border-radius:24px; border:1px solid var(--marron2); background:#fff; color:var(--marron); cursor:pointer; margin:3px; }
  button:hover{ background:var(--marron2); color:#fff; }
  button.peligro{ border-color:var(--rojo); color:var(--rojo); }
  button.peligro:hover{ background:var(--rojo); color:#fff; }
  button.verde{ border-color:var(--verde); color:var(--verde); }
  button.verde:hover{ background:var(--verde); color:#fff; }
  .arbol-anc{ overflow-x:auto; }
  .arbol-anc ul{ list-style:none; margin:0; padding-left:22px; }
  .arbol-anc>ul{ padding-left:0; }
  .arbol-anc li{ margin:7px 0; }
  .mini{ display:inline-block; background:#fff; border:1px solid var(--borde); border-radius:8px; padding:5px 10px; cursor:pointer; font-size:14.5px; }
  .mini:hover{ border-color:var(--marron2); }
  .mini b{ color:var(--marron); } .mini small{ color:var(--gris); }
  .vacio{ color:var(--gris); font-style:italic; font-size:14.5px; }
  .galeria{ display:flex; gap:12px; flex-wrap:wrap; margin-top:10px; }
  .gItem{ text-align:center; }
  .gItem img{ width:104px; height:104px; object-fit:cover; border-radius:10px; border:2px solid var(--borde); display:block; }
  .gItem button{ font-size:12px; padding:4px 10px; margin-top:5px; }
  .fotoGran{ max-width:300px; width:100%; border-radius:12px; border:3px solid var(--borde); }
  .cron{ list-style:none; padding-left:4px; margin:6px 0; }
  .cron li{ margin:10px 0; padding-left:14px; border-left:3px solid var(--borde); font-size:15.5px; }
  .cron b{ color:var(--marron); }
  .modal{ position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; z-index:100; overflow-y:auto; }
  .modal .caja{ background:#fff; max-width:520px; margin:40px auto; border-radius:14px; padding:22px; }
  .modal h3{ margin-top:0; color:var(--marron); }
  .modal label{ display:block; font-size:13.5px; color:var(--gris); margin:12px 0 4px; }
  .modal input[type=text], .modal select{ width:100%; padding:10px; font-size:16px; font-family:inherit; border:1px solid var(--borde); border-radius:8px; }
  .modal .acciones{ text-align:right; margin-top:18px; }
  #aviso{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#1E8449; color:#fff; padding:11px 22px; border-radius:24px; font-size:15px; display:none; z-index:200; box-shadow:0 6px 18px rgba(0,0,0,.3); }
  footer{ text-align:center; color:var(--gris); font-size:13px; padding:0 14px 26px; font-style:italic; }
</style>
</head>

    sibs.forEach(c => { if(c!==id && P[c]) set.set(c, P[c]); });
  });
  return [...set.values()];
}
function resumenFamiliar(p, id){
  const partes = [];
  const gs = (p.parents||[]).filter(g => (g.father&&P[g.father])||(g.mother&&P[g.mother]));
  if(gs.length){ const g = gs[0];
    const padres = [g.father, g.mother].filter(x => x && P[x]).map(enlace);
    if(padres.length) partes.push((p.sex==='F' ? 'Hija de ' : 'Hijo de ') + padres.join(' y ')); }
  (p.partners||[]).forEach(r => { if(r.partner && P[r.partner]) partes.push((p.sex==='F' ? 'Esposa de ' : 'Esposo de ') + enlace(r.partner)); });
  const hijos = []; (p.partners||[]).forEach(r => r.children.forEach(c => { if(P[c] && !hijos.includes(c)) hijos.push(c); }));
  if(hijos.length) partes.push((p.sex==='F' ? 'Madre de ' : 'Padre de ') + hijos.map(enlace).join('; '));
  const hs = hermanosDe(id);
  if(hs.length) partes.push('Hermano/a de ' + hs.slice(0,6).map(h => enlace(idDe(h))).join('; ') + (hs.length>6 ? ' y otros ' + (hs.length-6) : ''));
  return partes.join('. ');
}
function ir(id){
  actual = id; pestActual = 'general'; const p = P[id];
  let h = `<div class="tarjeta perfil">
    ${p.foto ? `<img class="fotoP" src="${p.foto}">` : `<div class="sinFoto">${p.sex==='F'?'&#128105;':'&#128104;'}</div>`}
    <div style="flex:1; min-width:230px">
      <h2>${p.name}</h2>
      <div class="dato"><b>Sexo:</b> ${p.sex==='F' ? 'Mujer' : 'Hombre'}</div>
      ${p.b||p.bp ? `<div class="dato"><b>Nacimiento:</b> ${p.b||''}${p.bp ? '<br><span style="margin-left:92px"></span>' + p.bp : ''}</div>` : ''}
      ${p.d ? `<div class="dato"><b>Defuncion:</b> ${p.d}</div>` : ''}
      <div class="resumen">${resumenFamiliar(p, id)}</div>
      <div class="botones" style="text-align:left; margin-top:12px">
        <button onclick="editarFicha('${id}')">&#9999;&#65039; Editar ficha</button>
        <button onclick="agregarFamiliar('${id}')">&#10133; Agregar familiar</button>
        <button class="peligro" onclick="borrarPersona('${id}')">&#128465;&#65039; Borrar</button>
      </div>
    </div>
  </div>
  <div class="tabs">
    <button class="tab activa" id="tab-general" onclick="pestana('general')">General</button>
    <button class="tab" id="tab-multimedia" onclick="pestana('multimedia')">Multimedia</button>
    <button class="tab" id="tab-cronologia" onclick="pestana('cronologia')">Cronologia</button>
  </div>
  <div class="panel" id="panel-general">${panelGeneral(id)}</div>
  <div class="panel" id="panel-multimedia" style="display:none">${panelMultimedia(id)}</div>
  <div class="panel" id="panel-cronologia" style="display:none">${panelCronologia(id)}</div>`;
  $('#vista').innerHTML = h; pintarAnc(); pintarDesc();
  window.scrollTo({top:0, behavior:'smooth'});
}
function pestana(n){
  pestActual = n;
  ['general','multimedia','cronologia'].forEach(x => {
    document.getElementById('panel-'+x).style.display = x===n ? 'block' : 'none';
    document.getElementById('tab-'+x).classList.toggle('activa', x===n);
  });
}
function panelGeneral(id){
  const p = P[id]; let h = '';
  const grupos = (p.parents||[]).filter(g => (g.father&&P[g.father])||(g.mother&&P[g.mother]));
  if(grupos.length){ h += '<h3 class="seccion">Padres</h3>';
    grupos.forEach(g => { h += '<div class="fila">';
      if(g.father&&P[g.father]) h += tarjeta(g.father,{txt:'Padre',cls:'padre'});
      if(g.mother&&P[g.mother]) h += tarjeta(g.mother,{txt:'Madre',cls:'madre'});
      h += '</div>'; }); }
  const hs = hermanosDe(id);
  if(hs.length){ h += `<h3 class="seccion">Hermanos (${hs.length})</h3><div class="fila">`;
    hs.sort((a,b)=>(a.b||'').localeCompare(b.b||''));
    hs.forEach(x => h += tarjeta(idDe(x),{txt:'Hermano/a',cls:'hermano'}));
    h += '</div>'; }
  const rels = (p.partners||[]).filter(r => (r.partner&&P[r.partner])||r.children.length);
  if(rels.length){ h += '<h3 class="seccion">Parejas e hijos</h3>';
    rels.forEach(r => { h += '<div class="tarjeta"><div class="fila">';
      if(r.partner&&P[r.partner]) h += tarjeta(r.partner,{txt:'Pareja',cls:'pareja'});
      else h += '<div class="persona"><span class="rol pareja">Pareja</span><br><span class="nom">(no registrada)</span></div>';
      h += '</div>';
      if(r.children.length){ h += '<div class="fila" style="margin-top:10px">';
        r.children.forEach(c => { if(P[c]) h += tarjeta(c,{txt:'Hijo/a',cls:'hijo'}); });
        h += '</div>'; }
      h += '</div>'; }); }
  if(!grupos.length && !rels.length && !hs.length) h += '<p class="vacio">Sin familiares registrados para esta persona.</p>';
  return h;
}
function panelMultimedia(id){
  const p = P[id]; const gal = p.galeria || [];
  let h = '<h3 class="seccion">Foto principal</h3>';
  h += p.foto ? `<img class="fotoGran" src="${p.foto}">` : '<p class="vacio">Esta persona aun no tiene foto.</p>';
  h += `<div class="botones" style="text-align:left">
    <button onclick="document.getElementById('fPrin').click()">&#128247; ${p.foto ? 'Cambiar foto principal' : 'Poner foto principal'}</button>
    ${p.foto ? '<button class="peligro" onclick="quitarPrincipal()">Quitar foto</button>' : ''}
    <input type="file" id="fPrin" accept="image/*" style="display:none" onchange="fotoPrincipalNueva(this)">
  </div>`;
  h += '<h3 class="seccion">Mas fotos</h3>';
  if(gal.length){ h += '<div class="galeria">' + gal.map((f, i) => `<div class="gItem"><img src="${f}"><br><button onclick="hacerPrincipal(${i})">Hacer principal</button> <button class="peligro" onclick="quitarGaleria(${i})">Quitar</button></div>`).join('') + '</div>'; }
  else h += '<p class="vacio">Sin fotos adicionales.</p>';
  h += `<div class="botones" style="text-align:left"><button onclick="document.getElementById('fGal').click()">&#10133; Agregar foto</button><input type="file" id="fGal" accept="image/*" style="display:none" onchange="fotoGaleriaNueva(this)"></div>`;
  return h;
}
function panelCronologia(id){
  const p = P[id]; const ev = [];
  if(p.b) ev.push({a: anio(p.b), t: `<b>${p.b}</b> &mdash; Nacimiento${p.bp ? ' en ' + p.bp : ''} de ${p.name}.`});
  const hijos = []; (p.partners||[]).forEach(r => r.children.forEach(c => { if(P[c] && !hijos.includes(c)) hijos.push(c); }));
  hijos.forEach(c => { const x = P[c]; if(x.b) ev.push({a: anio(x.b), t: `<b>${x.b}</b> &mdash; Nace su ${x.sex==='F' ? 'hija' : 'hijo'} ${enlace2(c)}.`}); });
  const hs = hermanosDe(id);
  hs.forEach(x => { if(x.b) ev.push({a: anio(x.b), t: `<b>${x.b}</b> &mdash; Nace su hermano/a ${enlace2(idDe(x))}.`}); });
  if(p.d) ev.push({a: anio(p.d), t: `<b>${p.d}</b> &mdash; Defuncion de ${p.name}.`});
  ev.sort((a,b) => (a.a||'9999').localeCompare(b.a||'9999'));
  if(!ev.length) return '<p class="vacio">Sin fechas registradas para armar la cronologia.</p>';
  return '<ul class="cron">' + ev.map(e => `<li>${e.t}</li>`).join('') + '</ul>';
}
function enlace2(id){ return `<a style="color:var(--azul2);cursor:pointer" onclick="ir('${id}')">${P[id].name}</a>`; }
function ramaAnc(id, prof){ const p = P[id]; if(!p) return '';
  let h = `<li><span class="mini" onclick="ir('${id}')">${p.foto?`<img class="foto-xs" src="${p.foto}">`:''}<b>${p.name}</b>${p.b?` <small>(${p.b})</small>`:''}</span>`;
  if(prof>0){ const g = (p.parents||[]).find(x => (x.father&&P[x.father])||(x.mother&&P[x.mother]));
    if(g){ h += '<ul>'; if(g.father) h += ramaAnc(g.father, prof-1); if(g.mother) h += ramaAnc(g.mother, prof-1); h += '</ul>'; } }
  return h + '</li>'; }
function pintarAnc(){ $('#anc').innerHTML = '<ul>' + ramaAnc(actual, 4) + '</ul>'; }
function ramaDesc(id, prof){ const p = P[id]; if(!p) return '';
  let h = `<div style="margin-left:${prof?18:0}px;margin-top:5px"><span class="mini" onclick="ir('${id}')">${p.foto?`<img class="foto-xs" src="${p.foto}">`:''}<b>${p.name}</b>${p.b?` <small>(${p.b})</small>`:''}</span>`;
  if(prof<4){ const hijos=[]; (p.partners||[]).forEach(r => r.children.forEach(c => { if(P[c]&&!hijos.includes(c)) hijos.push(c); }));
    hijos.forEach(c => h += ramaDesc(c, prof+1)); }
  return h + '</div>'; }
function pintarDesc(){ const hijos=[]; (P[actual].partners||[]).forEach(r => r.children.forEach(c => { if(P[c]&&!hijos.includes(c)) hijos.push(c); }));
  $('#desc').innerHTML = hijos.length ? hijos.map(c => ramaDesc(c,0)).join('') : '<p class="vacio">Sin descendientes registrados.</p>'; }
function alternar(id){ const el = document.getElementById(id); el.style.display = el.style.display==='none'?'block':'none'; if(el.style.display==='block') el.scrollIntoView({behavior:'smooth'}); }

// ---------- FOTOS ----------
function reducirFoto(file, cb){
  const img = new Image();
  img.onload = () => { const c = document.createElement('canvas'); const esc = Math.min(1, 260/Math.max(img.width, img.height));
    c.width = Math.round(img.width*esc); c.height = Math.round(img.height*esc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    cb(c.toDataURL('image/jpeg', 0.8)); };
  img.src = URL.createObjectURL(file);
}
function fotoPrincipalNueva(inp){ const f = inp.files[0]; if(!f) return;
  reducirFoto(f, d => { P[actual].foto = d; guardar(); ir(actual); pestana('multimedia'); }); }
function quitarPrincipal(){ delete P[actual].foto; guardar(); ir(actual); pestana('multimedia'); }
function fotoGaleriaNueva(inp){ const f = inp.files[0]; if(!f) return;
  reducirFoto(f, d => { const p = P[actual]; p.galeria = p.galeria || []; p.galeria.push(d); guardar(); ir(actual); pestana('multimedia'); }); }
function hacerPrincipal(i){ const p = P[actual]; const g = p.galeria[i];
  if(p.foto) p.galeria[i] = p.foto; else p.galeria.splice(i,1);
  p.foto = g; guardar(); ir(actual); pestana('multimedia'); }
function quitarGaleria(i){ P[actual].galeria.splice(i,1); guardar(); ir(actual); pestana('multimedia'); }

// ---------- EDICION ----------
function abrirModal(html){ $('#modalCaja').innerHTML = html; $('#modal').style.display='block'; }
function cerrarModal(){ $('#modal').style.display='none'; }
function campo(et, id, val){ return `<label>${et}</label><input type="text" id="${id}" value="${(val||'').replace(/"/g,'&quot;')}">`; }
let fotoNueva = undefined;
function fotoElegida(inp){ const f = inp.files[0]; if(!f) return;
  reducirFoto(f, d => { fotoNueva = d; const prev = document.getElementById('f_foto_prev'); prev.src = d; prev.style.display='block'; }); }
function quitarFotoForm(){ fotoNueva = ''; const prev = document.getElementById('f_foto_prev'); prev.style.display='none'; }
function editarFicha(id){ const p = P[id]; fotoNueva = undefined;
  abrirModal(`<h3>&#9999;&#65039; Editar ficha</h3>
  ${campo('Nombre completo','f_nom',p.name)}
  <label>Sexo</label><select id="f_sex"><option value="M" ${p.sex!=='F'?'selected':''}>Hombre</option><option value="F" ${p.sex==='F'?'selected':''}>Mujer</option></select>
  <label>Foto principal</label><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><img id="f_foto_prev" src="${p.foto||''}" style="width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--borde);${p.foto?'':'display:none'}"><input type="file" accept="image/*" onchange="fotoElegida(this)"><button type="button" class="peligro" onclick="quitarFotoForm()">Quitar foto</button></div>
  ${campo('Fecha de nacimiento (ej.: 27 feb 1966)','f_b',p.b)}
  ${campo('Lugar de nacimiento','f_bp',p.bp)}
  ${campo('Fecha de defuncion (vacio si vive)','f_d',p.d)}
  <div class="acciones"><button onclick="cerrarModal()">Cancelar</button> <button class="verde" onclick="guardarFicha('${id}')">Guardar</button></div>`);
}
function guardarFicha(id){ const p = P[id];
  if(fotoNueva !== undefined){ if(fotoNueva) p.foto = fotoNueva; else delete p.foto; fotoNueva = undefined; }
  p.name = $('#f_nom').value.trim() || p.name; p.sex = $('#f_sex').value;
  p.b = $('#f_b').value.trim(); p.bp = $('#f_bp').value.trim(); p.d = $('#f_d').value.trim();
  cerrarModal(); guardar(); ir(id);
}
let nuevoSeq = 0;
function nuevoId(){ let id; do { id = 'NUEVO' + Date.now() + (nuevoSeq++); } while (P[id]); return id; }
function agregarFamiliar(id){ const p = P[id];
  abrirModal(`<h3>&#10133; Agregar familiar de ${p.name}</h3>
  <label>Relacion con esta persona</label>
  <select id="a_rel">
    <option value="hijo">Hijo/a</option><option value="pareja">Pareja</option>
    <option value="padre">Padre</option><option value="madre">Madre</option><option value="hermano">Hermano/a</option>
  </select>
  ${campo('Nombre completo del familiar','a_nom','')}
  <label>Sexo</label><select id="a_sex"><option value="M">Hombre</option><option value="F">Mujer</option></select>
  ${campo('Fecha de nacimiento (ej.: 5 ene 1990)','a_b','')}
  ${campo('Lugar de nacimiento','a_bp','')}
  <div class="acciones"><button onclick="cerrarModal()">Cancelar</button> <button class="verde" onclick="guardarFamiliar('${id}')">Agregar</button></div>`);
}
function enlazarPareja(a, b){
  if(!P[a].partners.some(r => r.partner===b)) P[a].partners.push({partner:b, children:[]});
  if(!P[b].partners.some(r => r.partner===a)) P[b].partners.push({partner:a, children:[]});
}
function ponerPadres(hijo, padre, madre){
  P[hijo].parents = P[hijo].parents || [];
  const g = P[hijo].parents.find(x => (padre&&x.father===padre)||(madre&&x.mother===madre));
  if(g){ if(padre) g.father = padre; if(madre) g.mother = madre; }
  else P[hijo].parents.push({father: padre||null, mother: madre||null});
}
function agregarHijoA(padreId, madreId, hijoId){
  [padreId, madreId].forEach(par => { if(!par||!P[par]) return;
    const otro = par===padreId ? madreId : padreId;
    let rel = P[par].partners.find(r => r.partner===otro) || P[par].partners.find(r => !r.partner);
    if(!rel){ rel = {partner: otro||null, children:[]}; P[par].partners.push(rel); }
    if(otro) rel.partner = otro;
    if(!rel.children.includes(hijoId)) rel.children.push(hijoId);
  });
  ponerPadres(hijoId, padreId, madreId);
}
function guardarFamiliar(id){
  const rel = $('#a_rel').value, p = P[id];
  const nid = nuevoId();
  P[nid] = { name: $('#a_nom').value.trim() || '(sin nombre)', sex: $('#a_sex').value,
             b: $('#a_b').value.trim(), bp: $('#a_bp').value.trim(), d: '', parents: [], partners: [] };
  if(rel==='pareja'){ enlazarPareja(id, nid); }
  else if(rel==='hijo'){
    let parejaId = null;
    const conHijos = (p.partners||[]).slice().sort((a,b)=>b.children.length-a.children.length)[0];
    if(conHijos) parejaId = conHijos.partner;
    if(parejaId) enlazarPareja(id, parejaId);
    const padre = p.sex!=='F' ? id : parejaId, madre = p.sex==='F' ? id : parejaId;
    agregarHijoA(padre, madre, nid);
  }
  else if(rel==='padre' || rel==='madre'){
    const g = (p.parents&&p.parents[0]) || {father:null, mother:null};
    if(!p.parents || !p.parents.length) p.parents = [g];
    if(rel==='padre') g.father = nid; else g.mother = nid;
    if(g.father && g.mother) enlazarPareja(g.father, g.mother);
    const otro = rel==='padre' ? g.mother : g.father;
    agregarHijoA(rel==='padre' ? nid : otro, rel==='madre' ? nid : otro, id);
  }
  else if(rel==='hermano'){
    const g = (p.parents||[]).find(x => x.father||x.mother);
    if(g){ ponerPadres(nid, g.father, g.mother); agregarHijoA(g.father, g.mother, nid); }
    else { aviso('Primero agrega un padre o una madre'); delete P[nid]; cerrarModal(); return; }
  }
  cerrarModal(); guardar(); ir(id);
}
function borrarPersona(id){
  const p = P[id];
  if(!confirm('Borrar a ' + p.name + ' del arbol? Se puede deshacer restableciendo el original.')) return;
  Object.keys(P).forEach(k => { const q = P[k];
    q.partners = (q.partners||[]).map(r => ({ partner: r.partner===id ? null : r.partner, children: r.children.filter(c => c!==id) })).filter(r => r.partner || r.children.length);
    q.parents = (q.parents||[]).map(g => ({ father: g.father===id ? null : g.father, mother: g.mother===id ? null : g.mother })).filter(g => g.father || g.mother);
  });
  delete P[id]; guardar(); ir(ROOT in P ? ROOT : Object.keys(P)[0]);
}
function exportar(){
  const blob = new Blob([JSON.stringify(DATA, null, 1)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'mi-arbol-genealogico.json'; a.click(); URL.revokeObjectURL(a.href);
  aviso('Copia exportada &#11015;&#65039;');
}
function importar(inp){
  const f = inp.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if(!d.people) throw 0;
      DATA = d; P = DATA.people; guardar(); ir(ROOT in P ? ROOT : Object.keys(P)[0]); aviso('Copia importada &#10004;');
    } catch(e){ alert('Ese archivo no es una copia valida del arbol.'); } };
  r.readAsText(f);
}
function restablecer(){
  if(!confirm('Volver al arbol original de Geni? Se pierden los cambios hechos aqui.')) return;
  localStorage.removeItem(CLAVE); location.reload();
}
const q = $('#q'), res = $('#res');
q.addEventListener('input', () => {
  const t = q.value.trim(); if(t.length<2){ res.style.display='none'; return; }
  const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const hits = Object.keys(P).filter(id => norm(P[id].name).includes(norm(t))).slice(0,12);
  res.innerHTML = hits.map(id => `<div onclick="ir('${id}'); res.style.display='none'; q.value=''">${P[id].name} <small>${P[id].b||''}</small></div>`).join('') || '<div>Sin resultados</div>';
  res.style.display = 'block';
});
document.addEventListener('click', e => { if(!e.target.closest('.buscador')) res.style.display='none'; });
$('#modal').addEventListener('click', e => { if(e.target.id==='modal') cerrarModal(); });
$('#total').textContent = Object.keys(P).length;
ir(ROOT);
</script>
</body>
